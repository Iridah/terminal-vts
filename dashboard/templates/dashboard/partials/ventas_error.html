<div class="card shadow-sm border-0 border-start border-danger border-3">
  <div class="card-body">
    <p class="fw-semibold text-danger mb-2">
      <i class="fa-solid fa-triangle-exclamation me-2"></i>
      {% if error %}Error{% else %}Validación fallida{% endif %}
    </p>
    {% if error %}
      <p class="small text-muted mb-0">{{ error }}</p>
    {% endif %}
    {% if errores %}
      <ul class="small text-muted mb-0">
        {% for e in errores %}<li>{{ e }}</li>{% endfor %}
      </ul>
    {% endif %}
  </div>
</div>
